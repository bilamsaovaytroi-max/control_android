name: control-android-codex-pm

on:
  push:
    branches:
      - ai/goal-current
    paths:
      - '.ai/codex/DISPATCH.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-android-codex-pm
  cancel-in-progress: false

jobs:
  codex-pm-loop:
    runs-on: [self-hosted, Windows, X64, control_android]
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run Codex PM -> Claude -> single Worker loop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'C:\Users\OS\Desktop\Tools MMO\eBay Tool\control_android'
          $branch = 'ai/goal-current'
          $taskId = 'UNKNOWN'
          $taskFile = ''
          $pmExit = 999
          $reportContent = ''

          function Push-Commit([string]$message, [bool]$allChanges) {
            git config user.name 'control-android-codex-pm'
            git config user.email 'codex-pm@users.noreply.github.com'
            if ($allChanges) {
              git add -A
            } else {
              $reportPath = ".ai/codex/reports/$taskId.md"
              if (Test-Path $reportPath) { git add --force $reportPath }
            }
            if (-not (git diff --cached --quiet)) {
              git commit -m $message | Out-Host
              $pushUrl = "https://x-access-token:$env:GH_TOKEN@github.com/bilamsaovaytroi-max/control_android.git"
              git push $pushUrl "HEAD:$branch" | Out-Host
            }
          }

          if (-not (Test-Path $repo)) { throw "Project folder not found: $repo" }
          Set-Location $repo

          git fetch origin $branch
          git checkout -B $branch "origin/$branch"
          git reset --hard "origin/$branch"
          # Remove stale untracked product files from a failed prior run while preserving
          # the upstream reference checkout and local environment caches.
          git clean -fd -e vendor/ -e .venv/ -e artifacts/ -e logs/ | Out-Host

          $dispatchPath = Join-Path $repo '.ai\codex\DISPATCH.json'
          if (-not (Test-Path $dispatchPath)) { throw 'Missing .ai/codex/DISPATCH.json' }
          $dispatch = Get-Content $dispatchPath -Raw | ConvertFrom-Json
          $taskId = [string]$dispatch.task_id
          $taskFile = [string]$dispatch.task_file
          if ([string]::IsNullOrWhiteSpace($taskId)) { throw 'dispatch.task_id is required' }
          if ([string]::IsNullOrWhiteSpace($taskFile)) { throw 'dispatch.task_file is required' }
          if (-not (Test-Path (Join-Path $repo $taskFile))) { throw "Task file missing: $taskFile" }

          $pyCmd = (Get-Command py -ErrorAction SilentlyContinue).Source
          if (-not $pyCmd -and (Test-Path 'C:\Windows\py.exe')) { $pyCmd = 'C:\Windows\py.exe' }
          if (-not $pyCmd) { throw 'Python launcher not found.' }

          try {
            & $pyCmd -3.11 tools\pm_loop.py --repo-root $repo --task-file $taskFile --task-id $taskId --max-fix-rounds 3 --claude-timeout 120 --codex-timeout 900
            $pmExit = $LASTEXITCODE
          } catch {
            $pmExit = 998
            $runtimeReport = Join-Path $repo ".ai\codex\reports\$taskId.md"
            New-Item -ItemType Directory -Force -Path (Split-Path $runtimeReport) | Out-Null
            $body = @(
              "# CODEX PM REPORT — $taskId",
              "",
              "RESULT: BLOCKED",
              "PHASE: RUNNER_EXCEPTION",
              "",
              "```text",
              ($_ | Out-String),
              "```"
            ) -join [Environment]::NewLine
            $body | Set-Content -Encoding UTF8 $runtimeReport
          }

          $reportPath = Join-Path $repo ".ai\codex\reports\$taskId.md"
          if (Test-Path $reportPath) { $reportContent = Get-Content $reportPath -Raw }

          if ($pmExit -eq 0) {
            Push-Commit "codex-pm: $taskId ready for user test" $true
            exit 0
          }

          # Do not publish partial implementation after a failed/blocking loop.
          # Preserve the final report content, restore branch source, then publish only report evidence.
          git reset --hard HEAD
          git clean -fd -e vendor/ -e .venv/ -e artifacts/ -e logs/ | Out-Host
          if (-not [string]::IsNullOrWhiteSpace($reportContent)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $reportPath) | Out-Null
            $reportContent | Set-Content -Encoding UTF8 $reportPath
          }
          Push-Commit "codex-pm: $taskId blocked or failed" $false
          exit $pmExit
