name: control_android bridge

on:
  push:
    branches:
      - main
      - ai/**
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Windows, control_android]
    timeout-minutes: 20
    steps:
      - name: Prepare Git trust
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Python
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $candidates = @(
            'C:\Users\OS\AppData\Local\Programs\Python\Python311\python.exe',
            'C:\Users\OS\AppData\Local\Programs\Python\Python310\python.exe',
            'C:\Program Files\Python311\python.exe',
            'C:\Program Files\Python310\python.exe',
            'C:\Python311\python.exe',
            'C:\Python310\python.exe'
          )
          $python = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate) {
              & $candidate -c 'import sys; print(sys.executable)' *> $null
              if ($LASTEXITCODE -eq 0) { $python = $candidate; break }
            }
          }
          if (-not $python -and (Test-Path -LiteralPath 'C:\Windows\py.exe')) {
            $resolved = (& 'C:\Windows\py.exe' -3.11 -c 'import sys; print(sys.executable)').Trim()
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $resolved)) { $python = $resolved }
          }
          if (-not $python -or -not (Test-Path -LiteralPath $python)) { throw 'Python 3.10+ was not found on the runner.' }
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONHOME=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Python: $python"

      - name: Verify Python
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PYTHON_EXE)) { throw "Python not found: $env:PYTHON_EXE" }
          & $env:PYTHON_EXE --version
          & $env:PYTHON_EXE -m pip --version

      - name: Install project test dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: '& $env:PYTHON_EXE -m pip install -e ".[dev]"'

      - name: Compile source
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: '& $env:PYTHON_EXE -m compileall src'

      - name: Run tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: '& $env:PYTHON_EXE -m pytest -q'

      - name: Run health check
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: '& $env:PYTHON_EXE -m control_android.cli health'

      - name: Collect evidence
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/bridge | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 artifacts/bridge/commit.txt
          & $env:PYTHON_EXE --version 2>&1 | Out-File -Encoding utf8 artifacts/bridge/python.txt
          & $env:PYTHON_EXE -m control_android.cli devices 2>&1 | Out-File -Encoding utf8 artifacts/bridge/devices.txt

      - name: Upload bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-android-bridge-evidence
          path: artifacts/bridge
