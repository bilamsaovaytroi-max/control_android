[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-android"
version = "0.1.0"
description = "Reliable hybrid Android automation foundation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python", "pytesseract", "Pillow"]
webview = ["selenium"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
